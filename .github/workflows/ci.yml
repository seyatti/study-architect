name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/Checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          Python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.tx

      - name: Run tests
        run: python -m pytest